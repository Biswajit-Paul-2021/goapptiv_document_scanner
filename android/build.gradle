// Add debug at the top
println "=== Building goapptiv_document_scanner ==="
println "Project: ${project.name}"
println "Path: ${project.path}"
println "================================"

group = "com.goapptiv.goapptiv_document_scanner"
version = "1.0-SNAPSHOT"

// The plugin's Android code is Java only, so it applies no Kotlin plugin: Flutter
// warns about plugins that do once the app uses AGP 9. The AGP version here is
// only used when building the plugin on its own; an app uses its own version.
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.2")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.goapptiv.goapptiv_document_scanner"
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }


    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
